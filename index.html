<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watson’s The Neighbourhood Bar – Reservations</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c1511;--sf:#2a1f18;--sf2:#35281f;--tx:#f3e9d8;--mt:#b9a78c;--br:#f6b244;--bt:#1c1511;--gr:#3f8a63;--rd:#d0604a;--ln:#4a3a2c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4ecdd;--sf:#fffaf0;--sf2:#eadfca;--tx:#2a1f18;--mt:#6e5c47;--br:#8a5a12;--bt:#fffaf0;--gr:#25694a;--rd:#b04230;--ln:#d6c7ab;color-scheme:light}}
:root[data-theme="dark"]{--bg:#1c1511;--sf:#2a1f18;--sf2:#35281f;--tx:#f3e9d8;--mt:#b9a78c;--br:#f6b244;--bt:#1c1511;--gr:#3f8a63;--rd:#d0604a;--ln:#4a3a2c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Inter",system-ui,sans-serif}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;font-weight:700;margin:0 0 .6rem;line-height:1.25;letter-spacing:0}h2{font-size:1.5rem}h3{font-size:1.15rem}
.w{max-width:1100px;margin:0 auto;padding:1rem}
header{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;border-bottom:1px solid var(--ln);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
header b{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:1.25rem;line-height:1.15;color:var(--br)}header a{margin-left:.2rem;color:var(--tx);font-size:.9rem;border:1px solid var(--br);padding:.35rem .8rem;border-radius:8px;text-decoration:none}
.logo{width:46px;height:46px;border-radius:50%}
.hero{padding:2.5rem 0 1rem}.hero h1{font-size:clamp(1.7rem,4.5vw,2.7rem);line-height:1.2;margin:0}.hero p{color:var(--mt);max-width:52ch}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:1rem}
button.card{text-align:left;color:inherit;font:inherit;cursor:pointer}button.card:hover{border-color:var(--br)}
.card small,.mt{color:var(--mt)}
.team{display:flex;gap:1.5rem;flex-wrap:wrap;margin:.5rem 0 2rem}.team div{display:flex;gap:.6rem;align-items:center}
.av{width:44px;height:44px;border-radius:50%;background:var(--sf2);border:2px solid var(--br);display:grid;place-items:center;font-weight:700;color:var(--br)}
label{display:block;font-size:.9rem;color:var(--mt);margin-bottom:.9rem}
input,select,textarea{width:100%;margin-top:.25rem;padding:.65rem;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;font:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--br);outline-offset:1px}
.row{display:grid;gap:0 1rem;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.btn{background:var(--br);color:var(--bt);border:0;border-radius:8px;padding:.75rem 1.25rem;font:700 1rem "Inter",sans-serif;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.g{background:none;color:var(--tx);border:1px solid var(--ln)}.btn.s{padding:.35rem .7rem;font-size:.85rem}.btn.d{background:var(--rd);color:#fff}
.steps{display:flex;gap:.5rem;margin:1rem 0;flex-wrap:wrap}.steps span{padding:.25rem .8rem;border-radius:99px;border:1px solid var(--ln);font-size:.85rem;color:var(--mt)}.steps .on{background:var(--br);color:var(--bt);border-color:var(--br)}
.pax{display:flex;align-items:center;gap:.8rem}.pax button{width:40px;height:40px;border-radius:50%;border:1px solid var(--br);background:none;color:var(--br);font-size:1.3rem;cursor:pointer}.pax b{font-size:1.4rem;min-width:2ch;text-align:center}
.tbls{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));margin-bottom:1rem}
.t{padding:.6rem;border-radius:8px;border:1px solid var(--gr);background:none;color:var(--tx);font:inherit;cursor:pointer;text-align:center}.t small{display:block;color:var(--mt)}
.t.sel{background:var(--gr);color:#fff}.t.sel small{color:#fff}.t:disabled{border-color:var(--ln);opacity:.4;cursor:not-allowed;text-decoration:line-through}
.warn{background:var(--sf2);border-left:4px solid var(--rd);padding:.9rem 1rem;border-radius:6px;margin:1rem 0}
.sum{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;border-top:1px dashed var(--ln);padding-top:1rem;margin-top:1rem}
.tot{font-family:"Playfair Display",Georgia,serif;font-size:1.8rem;color:var(--br)}
.stats{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:1rem}.stats b{display:block;font-size:2rem;font-family:"Playfair Display",Georgia,serif;color:var(--br);font-weight:400}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:.55rem .6rem;border-bottom:1px solid var(--ln);white-space:nowrap}th{color:var(--mt);font-weight:500}
.tag{padding:.1rem .55rem;border-radius:99px;font-size:.78rem;background:var(--gr);color:#fff}.tag.x{background:var(--rd)}.tag.p{background:var(--br);color:var(--bt)}
.ok{text-align:center;padding:2rem 1rem}.ok .big{font-size:3rem}
.hero{padding:2.5rem 1.4rem;margin:1rem 0 1.5rem;border-radius:12px;background:#f6b244;border:0;display:flex;align-items:center;gap:1.4rem}.hero h1{color:#17120d}.hero p{color:#3a2a10;font-size:1.1rem;max-width:46ch}.hl{width:clamp(84px,14vw,130px);flex:none}.hero::after{content:"";display:block;clear:both}.ul{margin:.4rem 0 0;padding-left:1.2rem;color:var(--mt)}
.sec{margin-top:2.5rem}.three{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.num{font-family:"Playfair Display",Georgia,serif;font-size:2rem;color:var(--br);line-height:1}.ft{border-top:1px solid var(--ln);margin-top:3rem;color:var(--mt);font-size:.85rem}.ft a{color:var(--mt)}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:70vh;margin:-1rem;align-items:stretch}.side{background:var(--sf);border-right:1px solid var(--ln);padding:1rem;display:flex;flex-direction:column;gap:.25rem}.side .who{padding:.4rem .6rem 1rem;border-bottom:1px solid var(--ln);margin-bottom:.6rem}.nv{background:none;border:0;color:var(--tx);text-align:left;padding:.6rem .8rem;border-radius:8px;font:500 .95rem Inter,sans-serif;cursor:pointer}.nv:hover{background:var(--sf2)}.nv.on{background:var(--sf2);color:var(--br);font-weight:600}.main{padding:1.4rem;min-width:0}.main h2{margin-bottom:1rem}@media(max-width:760px){.shell{grid-template-columns:1fr}.side{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--ln)}.side .who{width:100%}}
.card{border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.18)}header{backdrop-filter:blur(8px)}
.hero{padding:2rem 1.6rem;border-radius:16px;box-shadow:0 10px 28px rgba(0,0,0,.28)}.hl{width:clamp(96px,16vw,150px)}
.sh::after,.sec h2::after{content:"";display:block;width:44px;height:3px;background:var(--br);margin-top:.45rem;border-radius:2px}
.grid button.card{display:flex;justify-content:space-between;align-items:center;padding:1.3rem 1.4rem;transition:transform .15s,border-color .15s,box-shadow .15s}.grid button.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.25)}.grid button.card::after{content:"\2192";color:var(--br);font-size:1.4rem}
.stats .card{border-top:3px solid var(--br);font-size:.74rem;color:var(--mt);text-transform:uppercase;letter-spacing:.07em;padding:1.1rem}.stats b{text-transform:none;letter-spacing:0;margin-bottom:.2rem}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;background:var(--sf2);position:sticky;top:0}tr:hover td{background:var(--sf2)}.tag{font-weight:600}
.side .who img{width:48px;height:48px;border-radius:50%;margin-bottom:.5rem;display:block}.nv{border-left:3px solid transparent}.nv.on{border-left-color:var(--br)}
.bars{display:flex;gap:.6rem;align-items:flex-end;padding-top:.5rem}.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:.25rem}.bars i{display:block;width:100%;background:var(--br);border-radius:4px 4px 0 0;min-height:3px}.bars span{font-weight:700}.bars small{color:var(--mt)}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:50}.mb{background:var(--sf);border:1px solid var(--br);border-radius:14px;padding:1.4rem;max-width:620px;width:100%;margin:1rem}@media print{header,.side,.btn,.mo{display:none!important}.shell{display:block;margin:0}}
</style></head><body>

function monv(){const m=AF.mm||today().slice(0,7),L=mine().filter(r=>r.date.startsWith(m)&&(!AF.o||r.outlet==AF.o)),A=L.filter(r=>r.status!="Cancelled"),days=[...new Set(A.map(r=>r.date))].sort(),ou=OUTLETS.filter(o=>!AF.o||o.id==AF.o);
 return `<h2>Monthly report</h2><div class="card"><div class="row">${osa("o")}<label>Month<input type="month" data-f="mm" value="${m}"></label></div>${PB}</div><div class="stats" style="margin-top:1rem">${kp(A.length,"Bookings")}${kp(pax$(A),"Guests")}${kp(inr(sum(conf(A))),"Fees collected")}${kp(pend(A).length,"Pending")}${kp(L.length-A.length,"Cancelled")}</div>
 <div class="card" style="margin-bottom:1rem"><h3>Day by day</h3>${days.length?`<div class="sc"><table><tr><th>Date</th><th>Bookings</th><th>Guests</th><th>Fees collected</th><th></th></tr>${days.map(d=>{const x=A.filter(r=>r.date==d);return `<tr><td>${d}</td><td>${x.length}</td><td>${pax$(x)}</td><td>${inr(sum(conf(x)))}</td><td><button class="btn s g" onclick="AF.dd='${d}';VIEW='day';admin()">View day</button></td></tr>`}).join("")}</table></div>`:`<p class="mt">No bookings this month.</p>`}</div>
 ${ME.o?"":`<div class="card"><h3>By outlet</h3><div class="sc"><table><tr><th>Outlet</th><th>Bookings</th><th>Guests</th><th>Pending</th><th>Fees collected</th></tr>${ou.map(o=>{const x=A.filter(r=>r.outlet==o.id);return `<tr><td>${o.name}</td><td>${x.length}</td><td>${pax$(x)}</td><td>${pend(x).length}</td><td>${inr(sum(conf(x)))}</td></tr>`}).join("")}</table></div></div>`}`}
function payv(){const m=AF.pm||"",L=mine().filter(r=>(!AF.o||r.outlet==AF.o)&&(!m||(r.created||r.date).startsWith(m))&&(!AF.mt||(AF.mt=="Online"?/^(UPI|Card)$/.test(r.paid):/^Offline/.test(r.paid)))).sort((a,b)=>(b.created||"").localeCompare(a.created||"")),by=x=>sum(L.filter(r=>pst(r)==x));
 return `<h2>Payment history</h2><div class="card"><div class="row">${osa("o")}<label>Month<input type="month" data-f="pm" value="${m}"></label><label>Method<select data-f="mt">${["","Online","Offline"].map(x=>`<option value="${x}" ${AF.mt==x?"selected":""}>${x||"All"}</option>`).join("")}</select></label></div>${PB}</div><div class="stats" style="margin-top:1rem">${kp(inr(by("Paid online")),"Paid online")}${kp(inr(by("Paid at outlet")),"Paid at outlet")}${kp(inr(by("Due")),"Due (pending)")}${kp(inr(by("Cancelled")),"Cancelled bookings")}</div>
 <div class="card sc">${L.length?`<table><tr><th>Paid on</th><th>Booking</th><th>Guest</th><th>Outlet</th><th>Method</th><th>Amount</th><th>Payment status</th></tr>${L.map(r=>`<tr><td>${r.created?new Date(r.created).toLocaleString("en-IN"):"-"}</td><td>${r.id}</td><td>${esc(r.name)}<br><small class="mt">${esc(r.phone)}</small></td><td>${oName(r.outlet)}</td><td>${esc(r.paid||"-")}</td><td>${inr(r.amount)}</td><td><span class="tag ${pst(r)=="Paid online"||pst(r)=="Paid at outlet"?"":pst(r)=="Due"?"p":"x"}">${pst(r)}</span></td></tr>`).join("")}</table>`:`<p class="mt">No payments match.</p>`}</div>`}
function gstv(){const m={},q=(AF.gq||"").toLowerCase();mine().filter(r=>!AF.o||r.outlet==AF.o).forEach(r=>{const g=m[r.phone]=m[r.phone]||{n:r.name,p:r.phone,a:r.alt,e:r.email,c:0,l:"",t:0};g.c++;if(r.status=="Confirmed")g.t+=r.amount;if(r.date>g.l)g.l=r.date});const G=Object.values(m).filter(g=>!q||(g.n+g.p+(g.a||"")+g.e).toLowerCase().includes(q)).sort((a,b)=>b.l.localeCompare(a.l));
 return `<h2>Guest history</h2><div class="card"><div class="row">${osa("o")}<label>Search<input data-f="gq" placeholder="Name, number or email" value="${esc(AF.gq||"")}"></label></div></div><div class="card sc" style="margin-top:1rem">${G.length?`<table><tr><th>Guest</th><th>Mobile</th><th>Alternate</th><th>Email</th><th>Bookings</th><th>Fees paid</th><th>Last booking</th><th></th></tr>${G.map(g=>`<tr><td><b>${esc(g.n)}</b></td><td>${esc(g.p)}</td><td>${esc(g.a||"-")}</td><td>${esc(g.e)}</td><td>${g.c}</td><td>${inr(g.t)}</td><td>${g.l}</td><td><button class="btn s g" onclick="histG('${g.p}')">History</button></td></tr>`).join("")}</table>`:`<p class="mt">No guests yet.</p>`}</div>`}
function histG(ph){const L=mine().filter(r=>r.phone==ph).sort((a,b)=>b.date.localeCompare(a.date));modal(esc(L[0].name)+", booking history",`<p class="mt">${esc(ph)}${L[0].alt?", alt "+esc(L[0].alt):""}, ${esc(L[0].email)}<br>${L.length} bookings, ${inr(sum(conf(L)))} paid</p><div class="sc"><table><tr><th>Date</th><th>Outlet</th><th>Pax</th><th>Occasion</th><th>Status</th><th>Fee</th></tr>${L.map(r=>`<tr><td>${r.date}</td><td>${oName(r.outlet)}</td><td>${r.pax}</td><td>${esc(r.occ)}</td><td>${r.status}</td><td>${inr(r.amount)}</td></tr>`).join("")}</table></div>`)}
async function loadAll(){const [a,b,c,d]=await Promise.all([api("/rest/v1/reservations?select=*&order=created_at.desc&limit=5000"),api("/rest/v1/inventory?select=*&order=item"),api("/rest/v1/blocks?select=*"),api("/rest/v1/email_log?select=*&order=created_at.desc&limit=500")]);RES=a.map(fromDB);INV=b.map(x=>({id:x.id,o:x.outlet_id,n:x.item,c:x.category,q:x.qty,u:x.unit,m:x.reorder_at}));BLK=c.map(x=>({id:x.id,o:x.outlet_id,d:x.date,t:x.table_no,r:x.reason}));MAIL=d.map(x=>({id:x.booking_code,outlet:x.outlet_id,to:x.to_email,kind:x.kind,sub:x.subject,body:x.body,t:x.created_at}))}
async function loadMe(){const u=await api("/auth/v1/user"),s=await api("/rest/v1/staff?select=role,outlet_id&user_id=eq."+u.id);if(!s.length)throw new Error("noaccess");ME={u:u.email,o:s[0].role=="head_office"?null:s[0].outlet_id,role:s[0].role}}
async function restore(){TRIED=true;try{await loadMe();await loadAll()}catch(e){TOK=null;try{sessionStorage.removeItem("wp_tok")}catch(x){}}admin()}
const fail=e=>{if(e&&e.status==401){TOK=null;ME=null;try{sessionStorage.removeItem("wp_tok")}catch(x){}admin();alert("Your session has expired. Please sign in again.")}else alert("Something went wrong: "+String(e&&e.message||e).slice(0,200))};
async function go(v){VIEW=v;try{await loadAll()}catch(e){return fail(e)}admin()}
async function wr(p,o){try{await api(p,{...o,h:{Prefer:"return=minimal"}});await loadAll();admin()}catch(e){fail(e)}}
const rid="/rest/v1/reservations?booking_code=eq.";
const em=e=>{try{const j=JSON.parse(e.message);return j.msg||j.message||j.error_description||e.message}catch(x){return e.message}};
async function login(){const b=$("#lb");b.disabled=true;let st="auth";try{const r=await api("/auth/v1/token?grant_type=password",{m:"POST",anon:true,b:{email:$("#u").value.trim(),password:$("#pw").value}});TOK=r.access_token;try{sessionStorage.setItem("wp_tok",TOK)}catch(x){}st="staff";await loadMe();st="data";await loadAll();VIEW="over";AF={o:"",d:"",st:"",q:""};TRIED=true;admin()}catch(e){TOK=null;b.disabled=false;alert(e.message=="noaccess"?"You signed in, but this user is not in the staff table yet. Add this user’s ID to the staff table in Supabase.":st=="auth"?"Sign-in failed: "+em(e)+". Check the email and password, and that the user is confirmed in Supabase.":st=="staff"?"Signed in, but the staff table could not be read: "+em(e):"Signed in, but loading data failed: "+em(e)+". Check that the blocks and email_log tables were created.")}}
function logout(){TOK=null;ME=null;RES=[];try{sessionStorage.removeItem("wp_tok")}catch(x){}admin()}
function assignT(id,t){const r=RES.find(x=>x.id==id);if(t&&(RES.some(x=>x.id!=id&&x.outlet==r.outlet&&x.date==r.date&&x.slot==r.slot&&x.tbl==t&&x.status!="Cancelled")||BLK.some(b=>b.o==r.outlet&&b.d==r.date&&b.t==t))){alert(t+" is already taken or blocked for that date and time.");return admin()}wr(rid+id,{m:"PATCH",b:{table_no:t||null}})}
function blk(o,d,t){const b=BLK.find(x=>x.o==o&&x.d==d&&x.t==t);if(b)return wr("/rest/v1/blocks?id=eq."+b.id,{m:"DELETE"});const r=prompt("Reason for blocking "+t+"?");if(r===null)return;wr("/rest/v1/blocks",{m:"POST",b:{outlet_id:o,date:d,table_no:t,reason:r||"Blocked"}})}
function stk(id,n){const i=INV.find(x=>x.id==id);wr("/rest/v1/inventory?id=eq."+id,{m:"PATCH",b:{qty:Math.max(0,i.q+n)}})}
function delI(id){if(confirm("Remove this item?"))wr("/rest/v1/inventory?id=eq."+id,{m:"DELETE"})}
function addI(o){const n=$("#in").value.trim();if(!n)return alert("Enter an item name.");wr("/rest/v1/inventory",{m:"POST",b:{outlet_id:o,item:n,category:$("#ic").value,qty:+$("#iq").value||0,unit:$("#iu").value||"pcs",reorder_at:+$("#im").value||0}})}
function starter(o){wr("/rest/v1/inventory",{m:"POST",b:STARTER.map(x=>({outlet_id:o,item:x[0],category:x[1],qty:x[2],unit:x[3],reorder_at:x[4]}))})}
function addNote(id){const t=prompt("Add a staff note for this booking");if(!t)return;const r=RES.find(x=>x.id==id);wr(rid+id,{m:"PATCH",b:{staff_notes:(r.snote?r.snote+"\n":"")+new Date().toLocaleDateString("en-IN")+": "+t}})}
function cancel(id){if(confirm("Cancel booking "+id+"?"))wr(rid+id,{m:"PATCH",b:{status:"Cancelled"}})}
async function confirmB(id){const r=RES.find(x=>x.id==id);try{await notify(r)}catch(e){return fail(e)}wr(rid+id,{m:"PATCH",b:{status:"Confirmed",payment_method:"Offline (paid at outlet)"}})}
$("#lg").src=LOGO;
route();
</script></body></html>
